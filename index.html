  <main id="main">
    <!-- ============ LANDING / HERO ============ -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <h1 class="sr" id="hero-title">Ashfaque Salahudeen — designer</h1>
      <p class="sr">Branding, type, architecture, print, illustration, motion, communication, art direction, video, photography.</p>

      <div class="hero__canvas">
        <!-- sky.png holds the sky AND the sea; it is shown at 1.5x so the horizon lands where the Figma frame has it.
             If you export the separate WATER layer, save it as assets/hero/water.webp and it will draw on top. -->
        <div class="l px sky"   style="--zoom:.05;--o:50% 60%;--x:0;--y:-213;--w:1440;--h:933;--par:150"><div class="in"></div></div>
        <div class="l px water" style="--zoom:.08;--o:50% 0%;--x:0;--y:466;--w:1440;--h:254;--par:110"><div class="in"></div></div>
        <div class="l px haze"  style="--zoom:.05;--x:0;--y:330;--w:1440;--h:260;--par:100"><div class="in"></div></div>

        <div class="l px boat boat--l" style="--dx:-260;--zoom:.12;--o:50% 100%;--x:64;--y:315;--w:522;--h:232;--par:90;--fx:-140">
          <div class="in"><img src="assets/hero/boat.webp" alt="" decoding="async"></div>
        </div>
        <div class="l px boat boat--r" style="--dx:200;--zoom:.12;--o:50% 100%;--x:858;--y:315;--w:518;--h:222;--par:90;--fx:140">
          <!-- prefers assets/hero/boat-1.webp if you add it; otherwise mirrors the first boat -->
          <div class="in"><img class="flip" src="assets/hero/boat-1.webp" alt="" decoding="async" onerror="this.onerror=null;this.src='assets/hero/boat.webp';this.classList.add('mirrored')"></div>
        </div>

        <div class="l px arc" style="--zoom:.04;--o:50% 100%;--x:243;--y:160;--w:955;--h:479;--par:70">
          <div class="in"><img src="assets/hero/arc.webp" alt="" decoding="async"></div>
        </div>
        <!-- skills ring: centred on the arch (centre 720.5, 638.5) with the letters on the middle of the band,
             rotating slowly; masked by the arch so it only shows inside the band -->
        <div class="l px arcmask" style="--zoom:.04;--o:50% 100%;--x:243;--y:160;--w:955;--h:479;--par:70" aria-hidden="true">
          <div class="in">
            <img class="ring" src="assets/hero/ring.webp" alt="" decoding="async" style="--rx:29.4;--ry:30.4;--rw:896.2">
          </div>
        </div>

        <div class="l px scene" style="--zoom:.09;--o:50% 85%;--x:0;--y:140;--w:1440;--h:726;--par:28">
          <div class="in">
            <img src="assets/hero/scene-1x.webp"
                 srcset="assets/hero/scene-1x.webp 1440w, assets/hero/scene-2x.webp 2880w"
                 sizes="(max-width: 900px) 1000px, 100vw"
                 alt="Ashfaque sitting on the bonnet of a hand-painted Indian truck, with palms, a banner reading “I design like I mean it” and a signpost pointing to Lakshadweep, Kerala, Bhopal, Guwahati and Next?"
                 fetchpriority="high" decoding="async" id="scene-img">
          </div>
        </div>

        <!-- palms are cut out of the scene so they can sway on their own (pivot = trunk base) -->
        <div class="l px palm palm--l" style="--x:15;--y:140;--w:297;--h:392;--ox:705;--oy:617;--par:28;--zoom:.09" aria-hidden="true"><div class="in"><img src="assets/hero/palm-l.webp" alt="" decoding="async"></div></div>
        <div class="l px palm palm--r" style="--x:1128;--y:140;--w:297;--h:374;--ox:-408;--oy:617;--par:28;--zoom:.09" aria-hidden="true"><div class="in"><img src="assets/hero/palm-r.webp" alt="" decoding="async"></div></div>

        <div class="l px grass" style="--x:0;--y:598;--w:1440;--h:268;--par:-14">
          <div class="in"><img src="assets/hero/front-grass.webp" alt="" decoding="async"></div>
        </div>
      </div>
    </section>

    <!-- ============ BUMPER DIVIDER ============ -->
    <div class="bumper" role="separator">
      <img src="assets/hero/bumper.webp" alt="Driven by curiosity, loaded with ideas" decoding="async" loading="lazy">
    </div>

    <div class="journey">
    <!-- ============ SHOWREEL (cab interior + TV) ============ -->
    <section class="sec showreel" id="showreel" aria-label="Showreel">
      <div class="stage">
        <img class="showreel__bg" src="assets/showreel/showreel.webp" alt="Inside a hand-painted truck cab with a retro TV and the word SHOWREEL on the windscreen" width="1440" height="1110" loading="lazy" decoding="async">
        <!-- Set data-video to a YouTube/Vimeo embed URL (e.g. https://www.youtube.com/embed/XXXX) to play the reel on the TV -->
        <button class="tv-screen" type="button" data-video="" aria-label="Play showreel"><span class="tv-screen__play"></span><span class="tv-screen__txt">PLAY REEL</span></button>
      </div>
    </section>

            <img src="assets/projects/box2-normal.webp" alt="" loading="lazy" decoding="async"><img class="h" src="assets/projects/box2-hover.webp" alt="" loading="lazy" decoding="async">
          </a>
          <a class="crate" href="https://www.behance.net/ashfaqusalahud" target="_blank" rel="noopener" style="--x:175;--y:1696;--w:636" aria-label="Ishanya 2026 — event identity">

          </a>
        </div>
      </div>
    </section>

          <a class="fi" href="https://www.linkedin.com/in/ashfaquesalahudeen" target="_blank" rel="noopener" style="--x:529;--y:354;--w:29.8" aria-label="LinkedIn"><img src="assets/footer/linkedin.webp" alt=""><img class="h" src="assets/footer/linkedin-hover.webp" alt=""></a>
          <a class="fi" href="mailto:ashfaquesalahudeen333@gmail.com" style="--x:407.5;--y:419.9;--w:192.4" aria-label="Email me"><img src="assets/footer/email.webp" alt=""><img class="h" src="assets/footer/email-hover.webp" alt=""></a>
          <a class="fi" href="#top" style="--x:433.2;--y:500.1;--w:142" aria-label="Back to top"><img src="assets/footer/top.webp" alt=""><img class="h" src="assets/footer/top-hover.webp" alt=""></a>

    </div>
